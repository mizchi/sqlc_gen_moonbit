version: "2"
plugins:
  - name: moonbit
    wasm:
      url: "file://../../_build/wasm/release/build/mizchi/sqlc_gen_moonbit/cmd/wasm/wasm.wasm"
sql:
  - engine: postgresql
    schema: "db/postgres/schema.sql"
    queries: "db/postgres/query.sql"
    codegen:
      - plugin: moonbit
        out: "db/gen"
        options:
          backend: "postgres"
          derives: ["Eq", "Debug", "ToJson"]
